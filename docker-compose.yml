# 简历智能匹配系统 (T2-2) — 一键编排
#
# 用法(在 x86_64 Linux 服务器上,如 DigitalOcean Droplet / 阿里云 / 腾讯云):
#   docker compose up -d --build      # 构建并后台启动
#   浏览器访问 http://<服务器IP>:8501
#
# platform 锁定 linux/amd64:服务器本身即 amd64 时此行无副作用;
# 仅在 Apple Silicon (M1/M2) 上构建给 x86 用时靠它强制出 amd64 镜像。

services:
  app:
    platform: linux/amd64
    build:
      context: .
      args:
        # 海外服务器(如 DigitalOcean)走官方 HF 最快;国内服务器改成 https://hf-mirror.com。
        HF_ENDPOINT: https://huggingface.co
    image: resume-matcher:latest
    ports:
      - "8501:8501"
    restart: unless-stopped
    volumes:
      # 可选:把宿主机 ./data 挂进容器,方便替换 Demo 用的简历/JD 数据,
      # 改数据不必重建镜像。模型已烘进镜像,不依赖此挂载。
      - ./data:/app/data:ro
    # ML 服务吃内存:加载模型 + 推理大约需 1~2GB。
    # ⚠️ DigitalOcean 1GB 内存的 Droplet 可能不够(构建期装 torch + 运行期加载模型),
    #    建议至少 2GB 内存的规格;内存不足会 OOM(容器反复重启)。
    mem_limit: 2g                     # 单机限制内存上限,防 OOM 拖垮宿主机
